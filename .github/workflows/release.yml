# Builds the desktop app for Windows, macOS and Linux and attaches the files to a GitHub release.
# Start it by pushing a version tag:
#   git tag v1.0.1
#   git push origin v1.0.1
# The tag must match "version" in package.json (without the v). A tag with a dash (v0.1.0-alpha.2) becomes a
# pre-release, which alpha and beta builds update to and normal builds ignore.
# Code signing: add the repository secrets WIN_CSC_LINK (the .pfx file, base64) and WIN_CSC_KEY_PASSWORD and the
# Windows build is signed; without them it is built unsigned (Windows SmartScreen then warns on first launch).
# latest*.yml and *.blockmap are uploaded too: the installed desktop app reads them to update itself.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist
          - os: macos-latest
            script: dist:mac
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CSC_LINK: ${{ matrix.os == 'windows-latest' && secrets.WIN_CSC_LINK || '' }}
      CSC_KEY_PASSWORD: ${{ matrix.os == 'windows-latest' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check the tag matches package.json
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then echo "Tag ${GITHUB_REF_NAME} does not match package.json version $v"; exit 1; fi
      - run: npm ci
      # The mod kit is the same on every system, so only the Linux job builds it (the check fails if its generated
      # reference is out of date with the game's data).
      - name: Mod kit
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/make-modkit.js --check && node scripts/make-modkit.js
      # An empty CSC_LINK makes electron-builder treat the project folder as the certificate, so drop empty ones.
      - name: Build
        shell: bash
        run: |
          if [ -z "$CSC_LINK" ]; then unset CSC_LINK CSC_KEY_PASSWORD; fi
          npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: destiny-unbound-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/latest*.yml
            dist/*.blockmap
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The release notes are this version's section of CHANGELOG.md ("## 0.1.0-alpha.6 ..." up to the next "## ").
      # Without a section the notes are just GitHub's "Full Changelog" link.
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '/^## / { on = (index($0, "## " v " ") == 1 || $0 == "## " v); next } on' CHANGELOG.md > release-notes.md
          cat release-notes.md
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: files/*
          body_path: release-notes.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  # Uploads the Windows installer, the portable version, the browser build and the mod kit to itch.io with butler
  # (scripts/itch-push.js). Needs the repository secret BUTLER_API_KEY (an itch.io API key); without it this is
  # skipped and the upload can still be done by hand.
  itch:
    needs: release
    runs-on: ubuntu-latest
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Push to itch.io
        shell: bash
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then echo "No BUTLER_API_KEY secret set: skipping the itch.io upload."; exit 0; fi
          curl -sSfL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler && chmod +x butler/butler
          ./butler/butler -V
          BUTLER="$PWD/butler/butler" node scripts/itch-push.js --web --modkit

  # Posts "Destiny Unbound x.y.z is out" with the new commits to the Discord's #announcements channel, once the
  # GitHub release and the itch.io upload are done.
  # Needs the repository secret DISCORD_WEBHOOK (a webhook URL for that channel); without it this is skipped.
  announce:
    needs: [release, itch]
    if: ${{ !cancelled() && needs.release.result == 'success' }}   # announce even if the itch.io upload failed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Announce on Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: node scripts/discord-announce.js "${GITHUB_REF_NAME}"
